site_name: Píndoles ampliades · IABD
site_description: Fonaments, laboratoris i activitats progressives
use_directory_urls: false
docs_dir: docs
site_dir: site
exclude_docs: |
  /README.md
  /mkdocs.yml
  /**/codi/eixides/**
  /.venv/**
  /__pycache__/**
theme:
  name: material
  language: ca
  palette:
    primary: teal
    accent: amber
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - Inici: index.md
  - "01 · Python i entorns de treball": python-i-entorns/index.md
  - "02 · Jupyter: notebooks que es poden reproduir": jupyter-notebooks/index.md
  - "03 · NumPy i pandas: de les dades a les taules": python-per-a-dades-i/index.md
  - "04 · Exploració i qualitat de dades": eda-i-qualitat-de-dades/index.md
  - "05 · Visualització amb Matplotlib i seaborn": visualitzacio-amb-matplotlib-i-seaborn/index.md
  - "06 · Aprenentatge supervisat amb scikit-learn": scikit-learn-intro/index.md
  - "07 · Validació: mesurar allò que realment volem predir": validacio-de-models/index.md
  - "08 · Clustering i interpretació de perfils": clustering-i-segmentacio/index.md
  - "09 · Interpretabilitat: permutació, SHAP i LIME": xai-shap-lime/index.md
  - "10 · Dashboards i modelatge amb Power BI": dashboards-i-powerbi/index.md
  - "11 · MLflow: experiments traçables i comparables": mlflow-intro/index.md

