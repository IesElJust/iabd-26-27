[project.theme]
language = "ca"
features = ["navigation.tabs", "navigation.sections", "navigation.top", "search.highlight", "content.code.copy", "toc.follow"]

[project.theme.palette]
scheme = "default"
primary = "teal"
accent = "orange"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
pymdownx.details = {}
pymdownx.highlight = { anchor_linenums = true }
pymdownx.tasklist = { custom_checkbox = true }
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
toc = { permalink = true }
